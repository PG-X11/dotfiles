animations {
    enabled = yes

    # ─────────────────────────────
    # Clean modern bezier curves
    # ─────────────────────────────
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = smoothIn, 0.7, 0, 0.84, 0
    bezier = smoothInOut, 0.45, 0, 0.55, 1
    bezier = snappy, 0.2, 0.9, 0.2, 1
    bezier = workspace, 0.2, 1, 0.2, 1

    # ─────────────────────────────
    # Borders (subtle + modern)
    # ─────────────────────────────
    animation = border, 1, 4, smoothInOut
    animation = borderangle, 1, 6, smoothInOut

    # ─────────────────────────────
    # Windows (fast + soft scale)
    # ─────────────────────────────
    animation = windows, 1, 5, snappy, popin 92%
    animation = windowsIn, 1, 5, smoothOut, popin 92%
    animation = windowsOut, 1, 4, smoothIn, popin 92%
    animation = windowsMove, 1, 5, smoothInOut

    # ─────────────────────────────
    # Fading (clean, not slow)
    # ─────────────────────────────
    animation = fade, 1, 3, smoothInOut
    animation = fadeIn, 1, 3, smoothOut
    animation = fadeOut, 1, 2, smoothIn
    animation = fadeSwitch, 1, 2, smoothInOut

    # ─────────────────────────────
    # Workspaces (fluid but fast)
    # ─────────────────────────────
    animation = workspaces, 1, 5, workspace, slidefade 12%
    animation = workspacesIn, 1, 5, workspace, slidefade 12%
    animation = workspacesOut, 1, 4, smoothInOut, slidefade 12%

    # ─────────────────────────────
    # Layers (rofi, notifications etc.)
    # ─────────────────────────────
    animation = layers, 1, 6, snappy, popin 95%
    animation = layersIn, 1, 6, snappy, popin 95%
    animation = layersOut, 1, 3, smoothIn, fade
}
