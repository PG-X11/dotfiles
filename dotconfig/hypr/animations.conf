animations {
    enabled = yes

    # Smooth modern curves (less floaty than yours)
    bezier = fastOut, 0.2, 0.9, 0.2, 1
    bezier = smoothOut, 0.16, 1, 0.3, 1
    bezier = pop, 0.34, 1.56, 0.64, 1
    bezier = linear, 0, 0, 1, 1

    # Borders (keep subtle but alive)
    animation = border, 1, 6, fastOut
    animation = borderangle, 1, 12, linear, loop

    # Windows (snappy open, soft settle)
    animation = windows, 1, 8, pop, popin 85%
    animation = windowsIn, 1, 8, pop, popin 85%
    animation = windowsOut, 1, 6, fastOut, popin 90%
    animation = windowsMove, 1, 7, smoothOut

    # Fade (faster = less “laggy feeling”)
    animation = fade, 1, 3, fastOut
    animation = fadeSwitch, 1, 3, fastOut
    animation = fadeShadow, 1, 3, linear
    animation = fadeDim, 1, 3, fastOut

    # Workspaces (clean slide instead of float fade)
    animation = workspaces, 1, 7, smoothOut, slide
    animation = workspacesIn, 1, 7, smoothOut, slide
    animation = workspacesOut, 1, 7, smoothOut, slide

    # Layers (slightly punchy UI feel)
    animation = layers, 1, 7, pop, popin 92%
    animation = layersIn, 1, 7, pop, popin 92%
    animation = layersOut, 1, 5, fastOut, fade
}
