# todo - different modes of animation
animations {
    enabled = yes

    # Smooth, predictable acceleration curves (No bouncy overshoot)
    bezier = fluent, 0.25, 1, 0.3, 1
    bezier = linear, 0, 0, 1, 1

    # Borders (Clean, steady visibility)
    animation = border, 1, 5, fluent
    animation = borderangle, 1, 15, linear, loop

    # Windows (Crisp open and close, perfectly paced)
    animation = windows, 1, 5, fluent, popin 92%
    animation = windowsIn, 1, 5, fluent, popin 92%
    animation = windowsOut, 1, 4, fluent, popin 95%
    animation = windowsMove, 1, 4.5, fluent

    # Fade (Smooth transitions without feeling muddy)
    animation = fade, 1, 3.5, fluent
    animation = fadeSwitch, 1, 4, fluent
    animation = fadeShadow, 1, 4, linear
    animation = fadeDim, 1, 4, fluent

    # Workspaces (Fluid vertical tracking, faster speed to cut delay)
    animation = workspaces, 1, 3, fluent, slidevert
    animation = workspacesIn, 1, 3, fluent, slidevert
    animation = workspacesOut, 1, 3, fluent, slidevert

    # Layers / UI Shell (Polished panels and menus)
    animation = layers, 1, 4, fluent, popin 93%
    animation = layersIn, 1, 4, fluent, popin 93%
    animation = layersOut, 1, 3.5, fluent, fade
}
