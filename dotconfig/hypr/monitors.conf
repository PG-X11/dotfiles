
# Monitors

# Laptop display
monitor=desc:AU Optronics 0x60ED,preferred,auto-left,1.2,bitdepth,10

# LG UltraGear (120 Hz)
# monitor=,desc:LG Electronics LG ULTRAGEAR 0x0009F446,1920x1080@119.98,0x0,1.2,bitdepth,10

# LG UltraGear (144 Hz OC)
# Uncomment this and comment the line above if you enable the monitor's overclock.
# max possible hertz all time
monitor=desc:LG Electronics LG ULTRAGEAR 0x0009F446,1920x1080@119.98,0x0,1.2,bitdepth,10
# monitor=desc:LG Electronics LG ULTRAGEAR 0x0009F446,1920x1080@143.98,0x0,1.2,bitdepth,10

## Workspaces
$lgm = monitor:desc:LG Electronics LG ULTRAGEAR 0x0009F446,persistent:true,default:true
workspace=1,$lgm
workspace=2,$lgm
workspace=3,$lgm
workspace=4,$lgm
$edp = monitor:desc:AU Optronics 0x60ED,persistent:true,default:true
workspace=5,$edp
workspace=6,$edp
workspace=7,$edp
workspace=8,$edp
workspace=9,$edp
# workspace=10,monitor:desc:AU Optronics 0x60ED,persistent:true
