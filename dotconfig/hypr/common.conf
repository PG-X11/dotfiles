# Variables
# todo - rewrite and configure for best, different presets too  eg.. glass, box, normal, no blur, no transparency, bash shell script controller
# random settings
xwayland {
    force_zero_scaling = true
}

input {
    sensitivity = 0.7
    force_no_accel = 1
    repeat_delay = 333
    repeat_rate = 50
    accel_profile = flat
    focus_on_close = 0
}
source = ~/.cache/wal/colors-hyprland.conf
general {
    allow_tearing = true
    gaps_in = 7
    gaps_out = 18
    # Borders
    col.active_border = $color1 $color1 $color2 45deg
    col.inactive_border = $background
    border_size = 3
    resize_on_border = true
    layout = scrolling
}

# # Scrolling layout config
scrolling {
    focus_fit_method = 1
    follow_focus = true
    wrap_focus = true
    fullscreen_on_one_column = true
    follow_min_visible = 0.1
    fullscreen_on_one_column = true
}

# Decoration Styles
decoration {
    border_part_of_window = false
    rounding = 20
    inactive_opacity = 0.8 #0.92
    blur {
        enabled = true
        size = 4
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        xray = false
        noise = 0.1
        contrast = 2
        brightness = 1
        vibrancy = -0.2
        vibrancy_darkness = 0.2
    }

    shadow {
        enabled = false
        range = 12
        render_power = 3
    }
}

# Miscellaneous Options
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # variable refresh rate
    # vrr = 1
}

# tablets
# xp pen deco 3
device {
    name = xp-pen-deco-03
    # map_to_output = eDP-1
}

# figured this out after a while
# using this :
render {
    direct_scanout = true
    non_shader_cm = 0
} # will make full screen apps not get rules from the compositor, which fixes most games and tf2 for sure
cursor {
    no_hardware_cursors = true
    no_break_fs_vrr = true
    sync_gsettings_theme = true
    min_refresh_rate = 100
    warp_on_change_workspace = 1
    use_cpu_buffer = 1

}

