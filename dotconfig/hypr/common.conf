# Variables

# random settings
xwayland {
    force_zero_scaling = true
}

input {
    sensitivity = 0.8
    force_no_accel = 1
    repeat_delay = 300
    repeat_rate = 40
    accel_profile = flat
}

general {
    allow_tearing = true
    gaps_in = 7
    gaps_out = 18
    resize_on_border = true
    layout = scrolling
}

# Scrolling layout config
scrolling {
    focus_fit_method = 1
    follow_focus = true
    wrap_focus = true
    fullscreen_on_one_column = true
    follow_min_visible = 0.1
}

# Decoration Styles
decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.92

    # configure blue here ;; idea - add a custom blur for everytheme and source from blue.conf
    blur {
        enabled = true
        size = 3
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.15
        vibrancy_darkness = 0.2
    }

    shadow {
        enabled = false
        range = 12
        render_power = 3
    }
}

# Miscellaneous Options
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # variable refresh rate
    vrr = 1
}

# tablets
# xp pen deco 3
device {
    name = xp-pen-deco-03
    # map_to_output = eDP-1
}

# figured this out after a while
# using this :
render {
    direct_scanout = true
} # will make full screen apps not get rules from the compositor, which fixes most games and tf2 for sure
cursor {
    no_hardware_cursors = true
    # Force both systems to lock onto 24px directly through the compositor
    sync_gsettings_theme = true
}

