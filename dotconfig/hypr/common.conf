# Variables

# random settings
xwayland {
  force_zero_scaling = true
}
allow_tearing = true
monitor=,preferred,auto,1.2

input {
    sensitivity = 1
    force_no_accel = 1
}

general {
    allow_tearing = true
    gaps_in = 6
    gaps_out = 20
    resize_on_border = true
    layout = scrolling

}

#Scrolling layout config
scrolling {
    focus_fit_method = 1
    follow_focus = true
    wrap_focus = true
    fullscreen_on_one_column = true
    follow_min_visible = 0.1
}



# decoration and stuff
decoration {
    rounding = 13
    rounding_power = 3
    ## dimming windows can be disabled here
    # dim_inactive = 1
    # dim_strength = 0.4
    active_opacity = 1
    inactive_opacity = 0.9

}
 misc {



force_default_wallpaper = 0
disable_hyprland_logo = true



}



# tablets
# xp pen deco 3
device {
    name = xp-pen-deco-03
    # map_to_output = eDP-1
}

input {
    repeat_delay = 250
    repeat_rate = 50
}




# configure blue here ;; idea - add a custom blur for everytheme and source from blue.conf
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.15
        vibrancy_darkness = 0.2
    }

    active_opacity = 0.96
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 18
        render_power = 3
    }
}




# figured this out after a while
# using the this :
render {
    # explicit_sync = true
    direct_scanout = true
} # will make full screen apps not get rules from the compositor, which fixes most games and tf2 for sure


