# Variables

# Other settings
xwayland {
  force_zero_scaling = true
}
allow_tearing = true
monitor=,preferred,auto,1.2

input {
    sensitivity = 1
    force_no_accel = 1
}

general {
    gaps_in = 6
    gaps_out = 20
    resize_on_border = true
    layout = scrolling
}

##Scrolling layout config
scrolling {
    focus_fit_method = 1
    follow_focus = true
    wrap_focus = true
    fullscreen_on_one_column = true
    follow_min_visible = 0.1
}

decoration {
    rounding = 13
    rounding_power = 3
    ## dimming windows can be disabled here
    # dim_inactive = 1
    # dim_strength = 0.4
    active_opacity = 1
    inactive_opacity = 0.9
}
 misc {

force_default_wallpaper = 0

disable_hyprland_logo = true

}
