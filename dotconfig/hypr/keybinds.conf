## variabls
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$altFileManager = kitty -e ranger
$menu = rofi -show drun
$browser = librewolf
$mediaplayer = QMPlay2
## edit keybinds here , duh
## basic hyprland controls
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move focus with $mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# alongside basic movement
bind = $mainMod+CTRL+SHIFT, left, movewindow, l
bind = $mainMod+CTRL+SHIFT, right, movewindow, r
bind = $mainMod, W, togglefloating,

# Resize active window with $mainMod + SHIFT + arrow keys
binde = $mainMod SHIFT, left, resizeactive, -20 0
binde = $mainMod SHIFT, right, resizeactive, 20 0
binde = $mainMod SHIFT, up, resizeactive, 0 -20
binde = $mainMod SHIFT, down, resizeactive, 0 20

# Move window with Super + Left Click
bindm = $mainMod, mouse:272, movewindow

# Resize window with Super + Right Click
bindm = $mainMod, mouse:273, resizewindow

# Changing workspace using arrows
bind = $mainMod+CTRL, left, workspace, -1
bind = $mainMod+CTRL, right, workspace, +1

## launching and quitting apps
# essentials
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainMod, delete, exec,  hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod+SHIFT, E, exec, $altFileManager
bind = SHIFT, F11, fullscreen, 0
bind = $mainMod, A, exec, $menu
bind = $mainMod, M, exec, $mediaplayer
bind = $mainMod+SHIFT, A, exec, /home/a7med/.local/bin/artapps
bind = $mainMod, G, exec, /home/a7med/.local/bin/gamemode-controller
bind = $mainMod, TAB, exec, rofi -show window
bind = $mainMod, H, exec, kate /home/a7med/.config/hypr
bind = $mainMod, R, exec, hyprctl reload & noctalia msg config-reload
bind = $mainMod, L, exec,  noctalia msg session lock
bind = $mainMod+SHIFT, L, exec, systemctl suspend
# theme changer and wallpaper changer
bind = $mainMod+SHIFT, W, exec, /home/a7med/.local/bin/wallchanger
bind = $mainMod+SHIFT, T, exec, /home/a7med/.local/bin/themeswitcher
# preset changer
bind = $mainMod+SHIFT, C, exec, /home/a7med/.local/bin/preset-switcher
# screen shots
bind = $mainMod, P, exec, /home/a7med/.local/bin/screenshot | wl-copy
bind = $mainMod+ALT, P, exec, /home/a7med/.local/bin/monitorscrshot | wl-copy
bind = $mainMod+SHIFT, P, exec, /home/a7med/.local/bin/colorpicker
bind = $mainMod, D, exec, wayscriber --daemon-toggle
# clipboard history with wl clip and cliphist
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p " " -config /home/a7med/dotfiles/scripts/clipboard/config.rasi | cliphist decode | wl-copy

bind = $mainMod+SHIFT, V, exec, cliphist wipe && noctalia msg clipboard-clear && notify-send "clipboard wiped!"

# noctalia shell toggle
bind = $mainMod+SHIFT, R, exec, bash -c 'pgrep noctalia >/dev/null && pkill noctalia|| noctalia &'

# Workspace app launchers
bind = ALT, 1, exec, /home/a7med/.config/hypr/scripts/workspace-apps/layout1.sh
bind = ALT, 2, exec, /home/a7med/.config/hypr/scripts/workspace-apps/layout2.sh
bind = ALT, 3, exec, /home/a7med/.config/hypr/scripts/workspace-apps/layout3.sh
bind = ALT, 4, exec, /home/a7med/.config/hypr/scripts/workspace-apps/layout4.sh

## Audio and media control
# audio down up
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#- added noctalia mic control
bindl = SHIFT, XF86AudioRaiseVolume, exec, noctalia msg mic-volume-up 5
bindl = SHIFT, XF86AudioLowerVolume, exec, noctalia msg mic-volume-down 5
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = $mainMod+SHIFT, M, exec
# Requires playerctl

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# mute mic
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind =$mainMod+CTRL ,X , exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
## brightness controls
#
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = ALT, F12, exec, brightnessctl set 100% #max brightness
bind = ALT, F11, exec, brightnessctl set 1% #min brightness


## layout control
# scrolling
bind = $mainMod, bracketleft, layoutmsg, move -col
bind = $mainMod, bracketright, layoutmsg, move +col

## environment switcher script
bind = $mainMod+SHIFT, delete, exec, bash /home/a7med/dotfiles/scripts/envswitcher/envswitcher.sh
