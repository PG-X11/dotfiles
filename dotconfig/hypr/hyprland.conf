# exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout4.sh FOR NOW THIS IS NOT WORKING

## Clip board
exec-once = wl-paste --watch cliphist store

# keyboard layouts
exec-once = fcitx5

# bar
exec-once = noctalia

# wayscriber
exec-once = wayscriber -d


# Plugins
plugin = /usr/lib/gloview.so
