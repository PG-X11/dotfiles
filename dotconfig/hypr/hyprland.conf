## sorcing files for organization
source = ./common.conf
source = ./keybinds.conf
source = ./env.conf
source = ./windowrules.conf
source = ./animations.conf
source = ./colors/colors.conf
source = ./scripts/workspace-apps/customrules.conf
source = ./scripts/artapps/artapps.conf
## auto starts
exec-once = awww-daemon &
exec-once = xrandr --output eDP-1 --primary
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout1.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-appslayout2.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-appslayout3.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-appslayout4.sh
# QuickShell Layer Rules
source = /home/a7med/.config/quickshell/hyprland-layer-config.conf
## Clip board
# Watch and save text selections
exec-once = wl-paste --type text --watch cliphist store

# Watch and save image/screenshot selections
exec-once = wl-paste --type image --watch cliphist store

# bar
exec-once = quickshell

