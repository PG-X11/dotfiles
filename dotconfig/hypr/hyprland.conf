## sorcing files for organization
source = ./common.conf
source = ./keybinds.conf
source = ./env.conf
source = ./windowrules.conf
source = ./animations.conf
source = ./monitors.conf
source = ./colors/colors.conf
source = ./scripts/workspace-apps/customrules.conf
source = ./scripts/artapps/artapps.conf
source = ./scripts/hypr-options/current-preset.conf

## auto starts
exec-once = awww-daemon &
exec-once = xrandr --output eDP-1 --primary
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
