## sorcing files for organization
source = ./common.conf
source = ./keybinds.conf
source = ./env.conf
source = ./windowrules.conf
source = ./animations.conf
source = ./monitors.conf
source = ./colors/colors.conf
source = ./scripts/workspace-apps/customrules.conf
source = ./scripts/artapps/artapps.conf
## auto starts
exec-once = awww-daemon &
exec-once = xrandr --output eDP-1 --primary
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout1.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout2.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout3.sh
exec-once = /home/a7med/.config/hypr/scripts/workspace-apps/layout4.sh
# QuickShell Layer Rules
source = /home/a7med/.config/quickshell/hyprland-layer-config.conf
## Clip board
# Watch and save text selections
exec-once = wl-paste --type text --watch cliphist store

# Watch and save image/screenshot selections
exec-once = wl-paste --type image --watch cliphist store

# keyboard layouts
exec-once = fcitx5
# bar
exec-once = quickshell
# Systemd dbus xdg portals
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE


exec-once = killall openbox
