windowrule = match:class ^(org.gnome.polkit-gnome-authentication-agent-1)$, workspace active

# steam no border
windowrule = match:class ^(steam.*)$, border_size 0
# airi project
hl.window_rule({ match = { class = "^(airi)$" }, float = 1, pin = 1, no_blur = 1, no_shadow = 1, opacity = "1.0 override 1.0 override" })
# polkit issue
windowrulev = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev = center, class:^(polkit-gnome-authentication-agent-1)$
# quick shell override full screen issue
# layerrule = ignorealpha 0, quickshell
