# window rules



# steam no border
windowrule = match:class ^(steam.*)$, border_size 0



# polkit issue
windowrulev = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev = center, class:^(polkit-gnome-authentication-agent-1)$
windowrule = match:class ^(org.gnome.polkit-gnome-authentication-agent-1)$, workspace active


# quick shell override full screen issue
# layerrule = ignorealpha 0, quickshell ;; fix later


# Firefox transparency
windowrule = match:class ^(firefox)$, opacity 0.9 override 0.9 override
windowrule = match:class ^(org.kde.kate)$, opacity 0.9 override 0.9 override


# full screen strip from compositor
# Automatically strip compositor effects from ANY fullscreen app
windowrule = match:fullscreen 1, immediate 1 force_rgbx 1 no_blur 1 no_anim 1 no_shadow 1

