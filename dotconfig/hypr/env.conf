env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

## Required for hybrid graphics (forces Intel integrated to render desktop, NVIDIA for games) like power optimizer
env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:00:02.0-card

## Cursor sizes for X11 and wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
## path location
env = PATH,$HOME/.local/share/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
## dolphin fix
env = XDG_MENU_PREFIX,plasma-
XDG_MENU_PREFIX=arch- kbuildsycoca6
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
# Force Electron apps (like AIRI) to use Wayland natively
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
# Clutter and SDL configurations for Wayland compatibility
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland

