# Core graphics -- CAREFUL - KEEP ONLY ONE COMMENTED OUT AND OTHER NOT COMMENTED,
# RESTART SESSION FOR CHANGES TO APPLY !
# NVIDIA GPU --
env = LIBVA_DRIVER_NAME,nvidia
env = VDPAU_DRIVER,nvidia
env = NVD_BACKEND,direct
env = __GLX_VENDOR_LIBRARY_NAME,nvidia 
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1
env = __GL_SYNC_TO_VBLANK,0
env = __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
env = AQ_DRM_DEVICES,/dev/dri/dgpu:/dev/dri/igpu
# Causes issues
# env = GBM_BACKEND,nvidia-drm # this makes nvidia render everything
# env = DRI_PRIME,1 # an X11 concept IDK if it works on xwayland apps

# INTEL GPU --
# env = AQ_DRM_DEVICES,/dev/dri/igpu:/dev/dri/dgpu
# env = LIBVA_DRIVER_NAME,i965
# env = __GLX_VENDOR_LIBRARY_NAME,intel
# env = GBM_BACKEND,dri
# env = WLR_NO_HARDWARE_CURSORS,0



# Wayland session settings
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1

# Cursor settings
env = XCURSOR_SIZE, 26
env = HYPRCURSOR_SIZE, 26
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# PATH
env = PATH,$HOME/.local/share/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin

# KDE / Dolphin compatibility
env = XDG_MENU_PREFIX,plasma-

# Qt / GTK application enhancements
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Browser and Electron apps
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# SDL / Clutter Wayland support
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
