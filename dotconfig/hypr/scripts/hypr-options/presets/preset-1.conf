decoration {
    rounding = 0
    active_opacity = 1 #0.96
    inactive_opacity = 0.57 #0.92
    # configure blue here ;; idea - add a custom blur for everytheme and source from blur.conf
    blur {
        enabled = true
        size = 4
        passes = 2
        ignore_opacity = false
        new_optimizations = true
        xray = false
        noise = 0.18
        contrast = 2
        brightness = 1
        vibrancy = -1
        vibrancy_darkness = 0.2
    }

    shadow {
        enabled = false
        range = 12
        render_power = 3
    }
}
