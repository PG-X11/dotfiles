$artapps = ^(krita|Darktable|Aseprite|blender|OpenTabletDriver.UX)

## Special workspace init
bind = SUPER, S, togglespecialworkspace, art
bind = SUPER SHIFT, S, movetoworkspace, special:art
## art apps to go there
windowrule {
    name = artapps
    workspace = special:art

    match:class = ^($artapps)$
}
