thickness = 32
widget_spacing = 11

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "launcher", "control-center", "session" ]
    opacity = 0.65999996662139893
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "battery", "clipboard", "notifications" ]
    opacity = 0.65999996662139893
    padding = 4.0

