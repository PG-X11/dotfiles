layer = "overlay"
max_visible = 2
position = "top_center"
scale = 0.90000000596046448

[plugins]
enabled = [
    "dotnetrob/cat",
    "liamwh/emoji-picker",
    "tordex/nvtop",
    "vn1k/cursor",
    "muhammadessam/misr-quran-radio",
    "tausif/ncs-visualizer",
    "yocraft/battery-widget",
    "ahmedhossamdev/sticky-notes"
]

[shell]
avatar_path = "/home/a7med/.face"
clipboard_auto_paste = "ctrl_v"
screen_time_enabled = true
show_location = false
time_format = "{:%I:%M}"

    [shell.animation]
    speed = 0.60000000894069672

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    polkit_placement = "attached"
    transparency_mode = "glass"

