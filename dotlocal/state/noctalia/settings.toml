shadow = false

[hooks]
wallpaper_changed = "ln -sfn ~/.cache/wal/noctalia-colors.json ~/.local/state/noctalia/community-paletts/wal.json && noctalia msg color-scheme-set community wal"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

